<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>RAIDEN – CONTACT FORM</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      text-align: center;
    }

    .hero {
      padding: 120px 20px 40px;
      background: url('ink-texture.png') center/cover no-repeat;
      background-color: rgba(0,0,0,0.55);
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 42px;
      letter-spacing: 0.18em;
      margin-bottom: 20px;
    }

    .form-box {
      max-width: 600px;
      margin: 40px auto;
      text-align: left;
      background: rgba(0,0,0,0.6);
      padding: 30px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      opacity: 0.9;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.4);
      color: #fff;
      border-radius: 4px;
      font-size: 16px;
      font-family: 'Zen Kaku Gothic New', sans-serif;
    }

    textarea {
      height: 150px;
      resize: none;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #4ea3ff;
      color: #000;
      text-align: center;
      border-radius: 4px;
      font-size: 18px;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: 0.3s;
      cursor: pointer;
    }

    .btn:hover {
      background: #7fc2ff;
      box-shadow: 0 0 15px #4ea3ff;
    }

    .back {
      margin-top: 40px;
      display: inline-block;
      color: #fff;
      opacity: 0.7;
      text-decoration: none;
      letter-spacing: 0.1em;
      transition: 0.3s;
    }

    .back:hover {
      opacity: 1;
      color: #4ea3ff;
    }

    #form-notice {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 520px;
      background: rgba(0,0,0,0.75) url('ink-texture.png') center/cover;
      border: 1px solid rgba(255,255,255,0.5);
      padding: 18px 0 14px;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.12em;
      color: #fff;
      opacity: 0;
      z-index: 9999;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(255,255,255,0.25);
    }

    .notice-close {
      position: absolute;
      right: 12px;
      top: 8px;
      font-size: 22px;
      cursor: pointer;
      opacity: 0.8;
      z-index: 10000;
      transition: 0.3s;
    }

    .notice-close:hover {
      opacity: 1;
      color: #4ea3ff;
    }

    #form-notice p {
      margin: 0;
      font-size: 17px;
    }

    #form-notice .sub {
      font-size: 13px;
      opacity: 0.85;
      letter-spacing: 0.08em;
      color: #4ea3ff;
    }

    .raiden-line {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #fff, #4ea3ff, #fff);
      animation: lightning 1.2s ease infinite;
      margin-top: 10px;
      filter: drop-shadow(0 0 6px #4ea3ff);
    }

    @keyframes lightning {
      0% { opacity: 0.3; }
      50% { opacity: 1; box-shadow: 0 0 15px #4ea3ff; }
      100% { opacity: 0.3; }
    }
  </style>
</head>

<body>

  <div class="hero">
    <div class="title">CONTACT FORM</div>

    <div class="form-box">
      <form action="#" method="post" onsubmit="sendForm(event)">
        <label>お名前</label>
        <input type="text" name="name" required>

        <label>メールアドレス</label>
        <input type="email" name="email" required>

        <label>お問い合わせ内容</label>
        <textarea name="message" required></textarea>

        <button class="btn" type="submit">送信する</button>
      </form>
    </div>

    <a href="contact.html" class="back">← CONTACT に戻る</a>
  </div>

  <div id="form-notice">
    <span class="notice-close">×</span>
    <p>
      お問い合わせを送信しました<br>
      <span class="sub">RAIDENより折り返しご連絡いたします</span>
    </p>
    <div class="raiden-line"></div>
  </div>

<script>
  function sendForm(e) {
    e.preventDefault();

    // 送信データ
    const data = {
      name: e.target.name.value,
      email: e.target.email.value,
      message: e.target.message.value
    };

    // GAS に送信
    fetch("https://script.google.com/macros/s/AKfycbzHGEcGh4CwrOyzgiC859aJLwglG6xi509_8XghccfImgHGU9VicvUrThuQk6JcI9SDMg/exec", {
      method: "POST",
      body: JSON.stringify(data)
    });

    // 通知表示
    const notice = document.getElementById('form-notice');
    const closeBtn = document.querySelector('.notice-close');

    notice.style.transition = "opacity 1s ease, top 1s ease";
    notice.style.opacity = "1";
    notice.style.top = "25px";

    function hideNotice() {
      notice.style.transition = "opacity 1s ease, top 1s ease";
      notice.style.opacity = "0";
      notice.style.top = "-120px";
      notice.style.pointerEvents = "none";
    }

    setTimeout(hideNotice, 5000);
    closeBtn.addEventListener('click', hideNotice);
  }
</script>

</body>
</html>
