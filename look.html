<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>LOOK - RAIDEN</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    text-align: center;
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    letter-spacing: 0.18em;
    margin: 80px 0 40px;
  }

  .look-grid {
    max-width: 1100px;
    margin: 0 auto 60px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 28px;
  }

  .look-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 20px;
    transition: 0.3s;
    text-decoration: none;
    color: #fff;
  }

  .look-card:hover {
    background: rgba(255,255,255,0.12);
    transform: translateY(-4px);
  }

  .look-card img {
    width: 100%;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  .look-card h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }

  .look-card p {
    font-size: 14px;
    opacity: 0.85;
  }

  /* 下部の青い BACK TO HOME */
    .back {
      margin: 100px 0 60px;
    }

    .back a {
      color: #4ea3ff;
      text-decoration: none;
      letter-spacing: 0.1em;
      transition: 0.3s;
    }

    .back a:hover {
      color: #7fc2ff;
    }
</style>
</head>

<body>

<div class="title">LOOK</div>

<div class="look-grid">

  <a href="1st_tshirt.html" class="look-card">
    <img src="P_RAIDEN_EN.PNG" alt="1st T-SHIRT">
    <h3>1st T-SHIRT</h3>
    <p>RAIDEN 初のプロダクト</p>
  </a>

  <a href="season.html" class="look-card">
    <img src="P_RAIDEN_KON.PNG" alt="SEASON">
    <h3>SEASON</h3>
    <p>四季 × 雷神の世界観</p>
  </a>

  <a href="gallery.html" class="look-card">
    <img src="P_RAIDEN_MIC.PNG" alt="GALLERY">
    <h3>GALLERY</h3>
    <p>雷神アートコレクション</p>
  </a>

</div>

  <div class="back">
    <a href="index.html">← BACK TO HOME</a>
  </div>

</body>
</html>
