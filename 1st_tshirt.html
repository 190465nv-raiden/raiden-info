<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>RAIDEN – 1st T-SHIRT</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- フォント -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    /* 背景雷アニメーション */
    @keyframes lightningFlash {
      0%, 95% { opacity: 0; }
      96% { opacity: 0.4; }
      97% { opacity: 0.8; }
      98% { opacity: 0.3; }
      100% { opacity: 0; }
    }

    .lightning-bg {
      position: fixed;
      inset: 0;
      background: url('lightning.jpg') center/cover no-repeat;
      opacity: 0;
      animation: lightningFlash 6s infinite;
      pointer-events: none;
      z-index: -1;
    }

    /* HERO */
    .hero {
      padding: 120px 20px 60px;
      background: url('ink-texture.png') center/cover no-repeat;
      background-color: rgba(0,0,0,0.55);
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      letter-spacing: 0.18em;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* 商品画像 */
    .item-img {
      width: 360px;
      max-width: 90%;
      margin: 40px auto 20px;
      display: block;
      filter: drop-shadow(0 0 25px rgba(255,255,255,0.25));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* 説明文 */
    .desc {
      max-width: 650px;
      margin: 40px auto;
      line-height: 2.1;
      font-size: 17px;
      opacity: 0.9;
    }

    /* ボタン */
    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 40px;
      border: 1px solid #4ea3ff;
      color: #4ea3ff;
      text-decoration: none;
      letter-spacing: 0.12em;
      transition: 0.3s;
      border-radius: 4px;
    }

    .btn:hover {
      background: #4ea3ff;
      color: #000;
      box-shadow: 0 0 15px #4ea3ff;
    }

    /* 戻るリンク */
    .back {
      margin-top: 60px;
      display: inline-block;
      color: #fff;
      opacity: 0.7;
      text-decoration: none;
      letter-spacing: 0.1em;
      transition: 0.3s;
    }

    .back:hover {
      opacity: 1;
      color: #4ea3ff;
    }
  </style>
</head>

<body>

  <div class="lightning-bg"></div>

  <div class="hero">
    <div class="title">1st T-SHIRT</div>

    <!-- ここにTシャツの画像を置く -->
    <img src="1st_tshirt.png" class="item-img" alt="1st T-SHIRT">

  <div class="desc">
  RAIDENを設立してから、初めての一着。<br>
  ブランドの始まりを刻む、象徴的なTシャツ。<br>
  この一着は非売品として制作され、RAIDENの原点を示す存在となる。
</div>  

    <a href="buy_comingsoon.html" class="btn">購入ページへ</a>

    <br><br>
    <a href="index.html" class="back">← トップページへ戻る</a>
  </div>

</body>
</html>
