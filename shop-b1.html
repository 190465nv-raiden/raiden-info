<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>RAIDEN | A1</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      background: #0a0a0a;
      color: #f2f2f2;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      margin: 0;
      padding: 0;
    }

    header h1 {
      text-align: center;
      padding: 50px 0 10px;
      font-size: 34px;
      letter-spacing: 3px;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
    }

    /* 導入の一言 */
    .lead {
      text-align: center;
      font-size: 16px;
      color: #bfbfbf;
      letter-spacing: 0.15em;
      margin-bottom: 40px;
      opacity: 0.9;
    }

    .item-box {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    .item-box img {
      width: 100%;
      max-width: 260px;
      height: auto;
      margin: 0 auto 20px;
      display: block;
      border-bottom: 1px solid #222;
      padding-bottom: 10px;
    }

    .item-box h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .item-box p {
      font-size: 15px;
      color: #ccc;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .price {
      font-size: 20px;
      margin-bottom: 25px;
      font-family: 'Orbitron', sans-serif;
    }

    .buy-btn {
      display: inline-block;
      padding: 12px 30px;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .buy-btn:hover {
      background: #222;
      border-color: #555;
    }

    .back {
      text-align: center;
      margin: 60px 0 40px;
    }

    .back a {
      color: #4ea3ff;
      text-decoration: none;
      letter-spacing: 0.1em;
      transition: 0.3s;
      font-family: 'Orbitron', sans-serif;
    }

    .back a:hover {
      color: #7fc2ff;
    }
  </style>
</head>

<body>

  <header>
    <h1>B1 – 黒</h1>
  </header>

  <div class="lead">
    形ではなく、気配を纏う。
  </div>

  <div class="item-box">
    <img src="shop-tshirt-b1.png">


    <p> </p>

    <p class="price">¥2,500</p>

    <a href="shop-form.html" class="buy-btn">購入する</a>
  </div>

  <div class="back">
    <a href="shop.html">← BACK TO SHOP</a>
  </div>

</body>
</html>
