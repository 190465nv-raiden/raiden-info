<form id="raidenForm">
  <label>商品名</label>
  <input id="item" type="text">

  <label>名前</label>
  <input id="name" type="text">

  <label>メール</label>
  <input id="email" type="email">

  <label>住所</label>
  <input id="address" type="text">

  <label>備考</label>
  <textarea id="note"></textarea>

  <button type="submit">送信</button>
</form>

<div id="result"></div>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbx9pNbhRWMP6jZIXDztaCDDXArAP_7neZTUO2fth6SROfcuEbY5w-Oti2WDhDS6xXrUKQ/exec";

document.getElementById("raidenForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    item: document.getElementById("item").value,
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    note: document.getElementById("note").value
  };

  try {
    const res = await fetch(GAS_URL, {
      method: "POST",
      mode: "cors",
      body: JSON.stringify(data)
    });

    const text = await res.text();
    document.getElementById("result").innerText = "送信成功: " + text;

  } catch (err) {
    document.getElementById("result").innerText = "送信失敗: " + err;
  }
});
</script>
