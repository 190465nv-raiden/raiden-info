<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GALLERY | RAIDEN</title>
  <link rel="icon" type="image/png" href="favicon.png">    
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      text-align: center;
      padding: 100px 20px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      letter-spacing: 0.15em;
      margin-bottom: 60px;
      text-shadow: 0 0 25px rgba(255,255,255,0.25);
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
    }

    .gallery img {
      width: 320px;
      max-width: 90%;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(255,255,255,0.15);
      transition: 0.4s;
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(255,255,255,0.35);
    }

    .caption {
      margin-top: 60px;
      font-size: 18px;
      line-height: 2;
      opacity: 0.85;
    }

    .back {
      margin-top: 80px;
    }

    .back a {
      color: #4ea3ff;
      text-decoration: none;
      letter-spacing: 0.1em;
      transition: 0.3s;
    }

    .back a:hover {
      color: #7fc2ff;
    }
  </style>
</head>
<body>

  <h1>GALLERY</h1>

  <div class="gallery">
    <img src="P_RAIDEN_EN.PNG" alt="円環雷神">
    <img src="P_RAIDEN_KON.PNG" alt="棍棒雷神">
    <img src="P_RAIDEN_MIC.PNG" alt="マイク雷神">
  </div>

  <div class="caption">
    雷神の三柱。<br>
    伝統・ストリート・カルチャー。<br>
    RAIDEN の魂がここに宿る。
  </div>

  <div class="back">
    <a href="index.html">← BACK TO HOME</a>
  </div>

</body>
</html>
